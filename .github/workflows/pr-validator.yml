name: DevSecOps Pipeline

on: [pull_request]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devsecops-bot .

      - name: Run Governance Bot
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # Add this if you did the Discord step
        run: docker run -e GITHUB_TOKEN -e REPO_OWNER -e REPO_NAME -e PR_NUMBER devsecops-bot